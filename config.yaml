# config.yaml
project:
  name: bundestage_speeches
  seed: 42

paths:
  data_dir: ./data
  model_dir: ./models
  logs_dir: ./logs

data:
  xml_file:   https://www.bundestag.de/resource/blob/1225450/21103.xml    #https://www.bundestag.de/resource/blob/1167604/21075.xml  # https://www.bundestag.de/resource/blob/1115000/21032.xml
  train_file: train.csv
  test_file: test.csv
  text_column: text
  label_column: label
  shuffle: true

summarization:
  model: t5-small
  tokenizer: t5-small
  max_length: 1100
  min_length: 700
  metric : ("rouge1", "rouge2", "rougeL")

ollama:
  host: http://localhost:11434
  model: qwen3.5:latest
  num_ctx: 8192       # Kontextfenster in Tokens (Ollama-Default ist viel kleiner)
  chunk_chars: 12000  # längere Reden werden in Abschnitte dieser Größe geteilt
  temperature: 0.2

sentiment_analysis:
  model: bert
  tokenizer: bert-base-german-cased
  num_labels: 3


